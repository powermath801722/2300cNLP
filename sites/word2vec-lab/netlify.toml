# Standalone Word2Vec Lab site. In Netlify, create a second site from this repo with
# Base directory = sites/word2vec-lab (build command and publish dir come from this file).
[build]
  command = "bash build.sh"
  publish = "dist"
  # Only rebuild when something this site ships changes (paths are relative to this base directory).
  ignore = "test \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" && git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- . ../../word2vec ../../favicon.svg ../../assets/fonts ../../assets/vendor/plotly-2.35.2.min.js"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/word2vec/model/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/word2vec/model/*.bin"
  [headers.values]
    Content-Type = "application/octet-stream"
