<!DOCTYPE html><html><head><meta charset="utf-8"></head><body><pre id="out"></pre>
<script type="module">
import { loadModel, transformers as T } from '/lab/shared/hf.js';
const log = [];
const { tokenizer, model } = await loadModel('Xenova/distilgpt2', 'causal');
const ids = tokenizer.encode('The river flows past the old mill and');
log.push('ids ' + ids.length);
const mk = (rows) => { const B = rows.length, n = rows[0].length; return { input_ids: new T.Tensor('int64', BigInt64Array.from(rows.flat().map(BigInt)), [B, n]), attention_mask: new T.Tensor('int64', new BigInt64Array(B * n).fill(1n), [B, n]) }; };
let t0 = performance.now(); let out = await model(mk([ids])); log.push('full fwd ms ' + (performance.now() - t0).toFixed(0) + ' keys ' + Object.keys(out).join(','));
t0 = performance.now(); for (let i = 0; i < 5; i++) out = await model(mk([ids.concat(Array(30).fill(262))])); log.push('5x fwd len' + (ids.length + 30) + ' ms ' + (performance.now() - t0).toFixed(0));
t0 = performance.now(); out = await model(mk([ids, ids, ids, ids])); log.push('batch4 ms ' + (performance.now() - t0).toFixed(0) + ' dims ' + out.logits.dims);
// past kv
try {
  const o1 = await model({ ...mk([ids]), use_cache: true });
  log.push('o1 keys ' + Object.keys(o1).join(','));
  const pkv = o1.past_key_values;
  log.push('pkv type ' + (pkv && pkv.constructor && pkv.constructor.name) + ' keys ' + (pkv && Object.keys(pkv).slice(0, 4).join(',')));
  const step = { input_ids: new T.Tensor('int64', BigInt64Array.from([262n]), [1, 1]), attention_mask: new T.Tensor('int64', new BigInt64Array(ids.length + 1).fill(1n), [1, ids.length + 1]), past_key_values: pkv, use_cache: true };
  t0 = performance.now(); const o2 = await model(step); log.push('step w/ past ms ' + (performance.now() - t0).toFixed(0) + ' dims ' + o2.logits.dims);
  const full = await model(mk([ids.concat([262])]));
  const V = 50257, a = o2.logits.data.slice(0, V), b = full.logits.data.slice(ids.length * V, (ids.length + 1) * V);
  let md = 0; for (let i = 0; i < V; i++) md = Math.max(md, Math.abs(a[i] - b[i])); log.push('maxdiff past vs full ' + md.toFixed(4));
} catch (e) { log.push('pkv err ' + e.message); }
log.push('decode 262: [' + tokenizer.decode([262]) + '] eos ' + tokenizer.decode([50256]));
document.getElementById('out').textContent = log.join('\n'); window.done = true;
</script></body></html>
