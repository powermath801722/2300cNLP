<!DOCTYPE html><html><head><meta charset="utf-8"></head><body><pre id="out"></pre>
<script type="module">
import { transformers as T } from '/lab/shared/hf.js';
const log = [];
for (const id of ['Xenova/distilgpt2', 'Xenova/gpt2']) {
  try {
    const tok = await T.AutoTokenizer.from_pretrained(id);
    const model = await T.AutoModelForCausalLM.from_pretrained(id, { dtype: 'q8', device: 'wasm', model_file_name: 'decoder_model_merged' });
    const ids = tok.encode('The horse raced past the barn');
    const mk = (a) => ({ input_ids: new T.Tensor('int64', BigInt64Array.from(a.map(BigInt)), [1, a.length]), attention_mask: new T.Tensor('int64', new BigInt64Array(a.length).fill(1n), [1, a.length]) });
    const o = await model(mk(ids));
    const V = 50257, n = ids.length, row = o.logits.data.slice((n - 1) * V, n * V);
    let best = 0; for (let i = 1; i < V; i++) if (row[i] > row[best]) best = i;
    const past = {}; for (const k of Object.keys(o)) if (k.startsWith('present.')) past[k.replace('present.', 'past_key_values.')] = o[k];
    const o2 = await model({ input_ids: new T.Tensor('int64', BigInt64Array.from([BigInt(best)]), [1, 1]), attention_mask: new T.Tensor('int64', new BigInt64Array(n + 1).fill(1n), [1, n + 1]), past_key_values: past });
    const full = await model(mk(ids.concat([best])));
    const a = o2.logits.data.slice(0, V), b = full.logits.data.slice(n * V, (n + 1) * V);
    const top = (x) => { let bi = 0; for (let i = 1; i < V; i++) if (x[i] > x[bi]) bi = i; return tok.decode([bi]); };
    log.push(`${id} ok next=${JSON.stringify(tok.decode([best]))} cached-next=${JSON.stringify(top(a))} full-next=${JSON.stringify(top(b))} keys=${Object.keys(o).length}`);
  } catch (e) { log.push(id + ' ERR ' + (e && (e.message || e))); }
}
document.getElementById('out').textContent = log.join('\n'); window.done = true;
</script></body></html>
