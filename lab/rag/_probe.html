<!DOCTYPE html><html><head><meta charset="utf-8"></head><body><pre id="o"></pre><script type="module">
import { pipe } from '/lab/shared/hf.js';
window.run = async (model, prompts) => { const g = await pipe('text2text-generation', model); const out=[]; for (const p of prompts){ const t0=performance.now(); const r = await g(p, { max_new_tokens: 48 }); out.push([r[0].generated_text, Math.round(performance.now()-t0)]);} return out; };
window.ok = true;
</script></body></html>
