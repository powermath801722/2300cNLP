<!DOCTYPE html>

<!-- data-slug must match lab/shared/modules.js; lab.js renders header, hero (title/tier/summary), pager and footer -->
<body data-slug="search">
<main id="main">

  <section class="s" aria-labelledby="how-h">

      <span class="kicker">02 · Concepts</span>
      <h2 id="how-h">How it works</h2>
      <div class="concepts"><!-- .panel.card blocks --></div>
    </div>
  </section>
  <section class="s" aria-labelledby="read-h">
    <div class="wrap">
      <span class="kicker">03 · Go further</span>
      <h2 id="read-h">Further reading</h2>
      <ul class="reading"><!-- real, well-known references only --></ul>
