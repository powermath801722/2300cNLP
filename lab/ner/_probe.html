<!DOCTYPE html><html><head><meta charset="utf-8"></head><body><pre id="out"></pre>
<script type="module">
import { pipe, transformers } from '/lab/shared/hf.js';
const out = {}; const log=(k,v)=>{out[k]=v;document.getElementById('out').textContent=JSON.stringify(out,null,1)};
try{
const ner = await pipe('token-classification','Xenova/bert-base-NER');
log('ner', await ner('Ada Lovelace worked in London for IBM.', { ignore_labels: [] }));
log('nerTokFn', typeof ner.tokenizer.tokenize);
log('nerTok', ner.tokenizer.tokenize ? ner.tokenizer.tokenize('Ada Lovelace worked in Washington, D.C.') : null);
log('id2label', ner.model.config.id2label);
}catch(e){log('nerErr',String(e))}
try{
const T = transformers;
log('hasQA', typeof T.AutoModelForQuestionAnswering);
const tok = await T.AutoTokenizer.from_pretrained('Xenova/distilbert-base-cased-distilled-squad');
const m = await T.AutoModelForQuestionAnswering.from_pretrained('Xenova/distilbert-base-cased-distilled-squad',{dtype:'q8',device:'wasm'});
const enc = tok('Who wrote it?', { text_pair: 'The note was written by Ada in 1843.' });
log('qaIds', Array.from(enc.input_ids.data).map(Number));
log('qaToks', tok.model.convert_ids_to_tokens(Array.from(enc.input_ids.data).map(Number)));
const o = await m(enc); log('qaOut', Object.keys(o)); log('qaDims', o.start_logits.dims);
}catch(e){log('qaErr',String(e))}
try{
const zs = await pipe('zero-shot-classification','Xenova/mobilebert-uncased-mnli');
log('zs', await zs('The match went to extra time and the home side won.', ['sports','politics','cooking'], { hypothesis_template: 'This text is about {}.' }));
log('zsMulti', await zs('The match went to extra time and the home side won.', ['sports','politics','cooking'], { multi_label: true }));
log('zsLabels', zs.model.config.id2label);
}catch(e){log('zsErr',String(e))}
try{
const tr = await pipe('translation','Xenova/opus-mt-en-fr');
let t0=performance.now(); log('tr', await tr('The river carries sediment to the sea.')); log('trMs', performance.now()-t0);
t0=performance.now();
try{ log('trBeam', await tr('The river carries sediment to the sea.', { num_beams: 4 })); log('beamMs',performance.now()-t0);}catch(e){log('beamErr',String(e))}
const enc = tr.tokenizer('The river carries sediment to the sea.');
log('srcToks', tr.tokenizer.model.convert_ids_to_tokens(Array.from(enc.input_ids.data).map(Number)));
const g = await tr.model.generate({ ...enc, max_new_tokens: 40 });
const ids = Array.from(g.data ?? g[0].data ?? g).map(Number); log('genIds', ids);
log('genToks', tr.tokenizer.model.convert_ids_to_tokens(ids));
log('genDims', g.dims);
}catch(e){log('trErr',String(e))}
window.__done=true;
</script></body></html>
