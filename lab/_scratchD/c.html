<!DOCTYPE html><html><head><meta charset="utf-8"></head><body><pre id=o></pre><script type="module">
import { pipe, loadModel } from '/lab/shared/hf.js';
const out={};
try{
const fm = await pipe('fill-mask','Xenova/distilbert-base-uncased');
out.fm = await fm('The river [MASK] overflowed after the storm.',{top_k:5});
const fx = await pipe('feature-extraction','Xenova/distilbert-base-uncased');
const t = await fx('I sat on the bank of the river.');
out.fxDims=t.dims;
const {tokenizer, model} = await loadModel('Xenova/distilbert-base-uncased','masked');
const enc = tokenizer('I sat on the bank.');
const r = await model({...enc, output_hidden_states:true});
out.keys=Object.keys(r); out.inputs = model.sessions?.model?.inputNames || Object.keys(model.sessions||{}); 
out.outputNames = model.sessions?.model?.outputNames;
}catch(e){out.err=e.message}
document.getElementById('o').textContent=JSON.stringify(out,null,1); window.done=true;
</script></body></html>
